nameOverride: ''
fullnameOverride: ''

imagePullSecrets: []
nodeSelector: {}
tolerations: []
affinity: {}

api:
  replicas: 1
  image:
    repository: travel-agent-api
    tag: '' # defaults to the chart's appVersion
    pullPolicy: Always
  containerPort: 3000
  healthPath: /api/health
  service:
    port: 3000
  # Extra env vars. Web search settings (all optional):
  #   SEARCH_PROVIDER           tavily | off (default: tavily when TAVILY_API_KEY is set).
  #                             Kill switch: --set api.env.SEARCH_PROVIDER=off, or set it in
  #                             the homelab values and run `npm run deploy`.
  #   SEARCH_RATE_PER_MINUTE    default 30; SEARCH_DAILY_LIMIT default 500;
  #   SEARCH_CACHE_TTL_SECONDS  default 900. Limits are best-effort, per pod, and reset on
  #                             restart: the hard cost ceiling is the Tavily plan.
  env: {}
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000 # "node" in the official node image
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

web:
  replicas: 1
  image:
    repository: travel-agent-web
    tag: '' # defaults to the chart's appVersion
    pullPolicy: Always
  containerPort: 8080
  healthPath: /
  service:
    port: 80
  env: {}
  securityContext:
    runAsNonRoot: true
    runAsUser: 101 # "nginx" in nginx-unprivileged
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

# The environment's Postgres: one CloudNativePG cluster, <release>-db (needs the CNPG
# operator). The API owns its "api" database and connects with the operator's
# <release>-db-app Secret; each agent backend with <component>.postgres.enabled gets
# its own role and database. Connections are TLS, verified against <release>-db-ca.
# Status: kubectl cnpg status travel-agent-db (or kubectl get cluster).
postgres:
  enabled: false
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18
  storageClass: ''
  size: 5Gi
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      memory: 512Mi
  # A PodMonitor for the CNPG dashboard (needs the monitoring.coreos.com CRDs).
  podMonitor:
    enabled: false
  isolation:
    # Ends pg_hba with "host all all all reject": each role reaches only its own
    # database. Turn off only if it ever locks out the operator.
    rejectOthers: true

# Which agent backend serves chat: inkeep (the Inkeep run API, below), parlant
# (the in-chart Parlant service, below) or langgraph (the in-chart LangGraph service, below). Sets CHAT_BACKEND on the API; the web app
# reads it from /api/config and picks the matching chat engine.
# The "Travel agent: cost by backend" dashboard, as a ConfigMap that Grafana's dashboard
# sidecar loads (label grafana_dashboard, any namespace). Enable it on one release only
# (the homelab prod values do): the dashboard picks the environment itself.
grafana:
  dashboard:
    enabled: false
    folder: Travel agent

# OpenTelemetry for api, langgraph (Node preload: auto-instrumentation plus
# @fastify/otel) and parlant (its built-in tracer and meter). Off by default:
# with it off the Node preload loads no SDK and Parlant keeps its local tracer.
# The homelab values turn it on with the Alloy endpoint.
otel:
  enabled: false
  # The central collector this release's own Alloy forwards to (OTLP/HTTP base URL),
  # e.g. http://alloy.monitoring.svc.cluster.local:4318. Apps never talk to it directly:
  # they export to <release>-alloy (templates/alloy.yaml), which stamps k8s.pod.ip for
  # the central Alloy's k8sattributes and, later, derives the LLM token metric.
  upstreamEndpoint: ''
  # prod | dev. Also picks service.namespace (travel-agent | travel-agent-dev),
  # which becomes Prometheus' job prefix, so dev and prod series stay apart.
  environment: prod
  # Lever if Tempo or CPU is stressed: parentbased_traceidratio (with
  # OTEL_TRACES_SAMPLER_ARG in <component>.env). Sampling belongs in the collector
  # long term, after the token rule.
  tracesSampler: parentbased_always_on
  metricExportIntervalMs: 15000
  # This release's Alloy. One replica, Recreate on updates: the token series it will
  # derive carry no instance label, so two overlapping pods would double-write them.
  collector:
    image:
      repository: grafana/alloy
      tag: v1.21.3 # same version as the central Alloy
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        memory: 512Mi
    # A ServiceMonitor for Alloy's own metrics (needs the monitoring.coreos.com CRDs).
    serviceMonitor:
      enabled: false

chat:
  backend: inkeep

# The Inkeep agent service behind /api/chat. Chat returns 503 until apiUrl and
# existingSecret are both set.
inkeep:
  # Inkeep's agents API as seen from the API pod, e.g. http://inkeep-api.inkeep:3002
  apiUrl: ''
  tenantId: default
  projectId: travel-agent
  agentId: travel-agent
  # Secret (created outside the chart) whose keys are added to the API's env. It needs:
  #   INKEEP_AGENTS_RUN_API_BYPASS_SECRET  the Inkeep run API bypass secret
  #   INTAKE_API_TOKEN                     shared token Inkeep's context fetcher sends back
  #   TAVILY_API_KEY                       web search provider key (optional; search is off without it)
  #   SEARCH_API_TOKEN                     Bearer token the agents send to /api/search/web and /api/mcp;
  #                                        the same value as SEARCH_API_TOKEN in Inkeep's inkeep-secrets
  #   LANGGRAPH_API_TOKEN                  Bearer token the API sends to the LangGraph service (only when
  #                                        langgraph.enabled); the same value as in langgraph.existingSecret
  # kubectl -n travel-agent create secret generic travel-agent-inkeep \
  #   --from-literal=INKEEP_AGENTS_RUN_API_BYPASS_SECRET=... --from-literal=INTAKE_API_TOKEN=... \
  #   --from-literal=TAVILY_API_KEY=... --from-literal=SEARCH_API_TOKEN=...
  # This is the API's Secret, not the Inkeep server's (that's inkeep.server.secret). With
  # inkeep.server.enabled the bypass secret comes from the server's Secret instead.
  existingSecret: ''

  # Inkeep itself, deployed by this chart: agents-api (plus its migrations), the manage UI,
  # SpiceDB and Doltgres (the manage DB). The run DB and SpiceDB's datastore are databases
  # "inkeep" and "spicedb" on the release's CloudNativePG cluster (needs postgres.enabled).
  # When enabled, the API talks to it in-cluster and apiUrl is ignored.
  server:
    enabled: false
    # Secret (made outside the chart: Tilt in dev, scripts/inkeep-secrets.sh prod) with
    #   ANTHROPIC_API_KEY, SEARCH_API_TOKEN, INTAKE_API_TOKEN (the same values as the API's),
    #   INKEEP_AGENTS_MANAGE_UI_USERNAME / _PASSWORD, INKEEP_AGENTS_RUN_API_BYPASS_SECRET,
    #   INKEEP_AGENTS_MANAGE_API_BYPASS_SECRET, INKEEP_AGENTS_JWT_SIGNING_SECRET,
    #   BETTER_AUTH_SECRET, INKEEP_ANON_JWT_SECRET,
    #   INKEEP_AGENTS_TEMP_JWT_PRIVATE_KEY / _PUBLIC_KEY, SPICEDB_PRESHARED_KEY, DOLTGRES_PASSWORD.
    # The database roles' passwords are basic-auth Secrets <release>-db-inkeep and
    # <release>-db-spicedb, like the other backends'.
    secret: ''
    # Keep the "inkeep" and "spicedb" database roles even while Inkeep is off (dev:
    # Tilt turns it off when another backend is selected, and its data should stay).
    keepDatabases: false
    # Matches the @inkeep/* packages in apps/agents.
    version: 0.80.4
    api:
      replicas: 1
      image:
        repository: inkeep/agents-api
        tag: '' # defaults to inkeep.server.version
        pullPolicy: IfNotPresent
      migrateImage:
        repository: inkeep/agents-migrate
        tag: ''
      containerPort: 3002
      healthPath: /health
      service:
        port: 3002
      # How a browser reaches the API and the manage UI (Tilt sets port-forward URLs).
      publicUrl: http://localhost:3002
      manageUiUrl: http://localhost:3003
      env: {}
      # Uploaded files. Without a PVC they reset when the pod restarts.
      blobStorage:
        persistence:
          enabled: false
          size: 1Gi
          storageClassName: ''
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        seccompProfile:
          type: RuntimeDefault
      resources:
        requests:
          cpu: 100m
          memory: 384Mi
        limits:
          memory: 2Gi
    ui:
      enabled: true
      replicas: 1
      image:
        repository: inkeep/agents-manage-ui
        tag: ''
        pullPolicy: IfNotPresent
      containerPort: 3000
      service:
        port: 3000
      env: {}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        seccompProfile:
          type: RuntimeDefault
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 1Gi
    spicedb:
      image:
        repository: authzed/spicedb
        tag: v1.49.2
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
    doltgres:
      image:
        repository: dolthub/doltgresql
        tag: 0.56.7
      storage:
        size: 10Gi
        storageClassName: ''
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 2Gi

ingress:
  enabled: true
  className: ''
  host: travel.example.com
  annotations: {}
  tls:
    enabled: false
    secretName: ''

# The Parlant agent service (apps/parlant), the alternative to Inkeep. The API
# proxies /api/parlant/* to it when chat.backend is parlant.
parlant:
  enabled: false
  replicas: 1
  image:
    repository: travel-agent-parlant
    tag: '' # defaults to the chart's appVersion
    pullPolicy: Always
  containerPort: 8800
  healthPath: /healthz
  service:
    port: 8800
  agentId: travel-agent
  # Parlant effort (min, low, medium, high, max) per phase. On Anthropic, replies
  # use Haiku 5.5 up to medium, Sonnet 5.5 at high and Opus 5.5 at max.
  effort:
    intake: high
    planning: high
  env: {}
  # Secret (created outside the chart) whose keys are added to Parlant's env. It needs:
  #   ANTHROPIC_API_KEY  Claude models
  #   VOYAGE_API_KEY     embeddings (Anthropic has no embedding API)
  #   INTAKE_API_TOKEN   the same token the API expects (see inkeep.existingSecret)
  #   SEARCH_API_TOKEN   the same search token the API expects (optional; the tool falls back without it)
  # kubectl -n travel-agent create secret generic travel-agent-parlant \
  #   --from-literal=ANTHROPIC_API_KEY=... --from-literal=VOYAGE_API_KEY=... \
  #   --from-literal=INTAKE_API_TOKEN=... --from-literal=SEARCH_API_TOKEN=...
  existingSecret: ''
  # Sessions and customers in the cluster's "parlant" database (needs postgres.enabled).
  # The role's password is a basic-auth Secret <release>-db-parlant, made outside the
  # chart (Tilt makes it from .env in dev):
  #   kubectl -n travel-agent create secret generic travel-agent-db-parlant \
  #     --type=kubernetes.io/basic-auth --from-literal=username=parlant \
  #     --from-literal=password=$(openssl rand -hex 32)
  # Don't turn this on in prod before sessions have a retention prune: they hold
  # whole guest conversations, with no expiry.
  postgres:
    enabled: false
  # Without postgres: sessions and customers live in SQLite under PARLANT_HOME, and
  # without a PVC they reset whenever the pod restarts. With postgres, PARLANT_HOME
  # only holds an embedding cache and logs, so the PVC isn't needed.
  persistence:
    enabled: false
    size: 1Gi
    storageClassName: ''
  # Makes the volume writable by the container's user (uid 1000).
  podSecurityContext:
    fsGroup: 1000
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi

# The LangGraph agent service (apps/langgraph), the third backend. The API proxies
# /api/langgraph/* to it when chat.backend is langgraph.
langgraph:
  enabled: false
  replicas: 1
  image:
    repository: travel-agent-langgraph
    tag: '' # defaults to the chart's appVersion
    pullPolicy: Always
  containerPort: 8900
  healthPath: /healthz
  service:
    port: 8900
  models:
    intake: claude-sonnet-5-5
    planning: claude-sonnet-5-5
  env: {}
  # Secret (created outside the chart) whose keys are added to the service's env. It needs:
  #   ANTHROPIC_API_KEY    Claude models
  #   INTAKE_API_TOKEN     the same token the API expects (see inkeep.existingSecret)
  #   SEARCH_API_TOKEN     the same search token the API expects (optional; the tool falls back without it)
  #   LANGGRAPH_API_TOKEN  the token the API sends (also in the API's secret)
  # kubectl -n travel-agent create secret generic travel-agent-langgraph \
  #   --from-literal=ANTHROPIC_API_KEY=... --from-literal=INTAKE_API_TOKEN=... \
  #   --from-literal=SEARCH_API_TOKEN=... --from-literal=LANGGRAPH_API_TOKEN=...
  existingSecret: ''
  # Checkpoints in the cluster's "langgraph" database (needs postgres.enabled). The
  # role's password is a basic-auth Secret <release>-db-langgraph, made outside the
  # chart (Tilt makes it from .env in dev):
  #   kubectl -n travel-agent create secret generic travel-agent-db-langgraph \
  #     --type=kubernetes.io/basic-auth --from-literal=username=langgraph \
  #     --from-literal=password=$(openssl rand -hex 32)
  # Don't turn this on in prod before checkpoints have a retention prune: they hold
  # whole guest conversations, with no expiry.
  postgres:
    enabled: false
  # Without postgres: checkpoints live in SQLite under /var/lib/langgraph, with no
  # expiry (they hold the guest's details: add a TTL prune before any prod use), and
  # without a PVC they reset whenever the pod restarts.
  persistence:
    enabled: false
    size: 1Gi
    storageClassName: ''
  # Makes the volume writable by the container's user (uid 1000).
  podSecurityContext:
    fsGroup: 1000
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 512Mi
