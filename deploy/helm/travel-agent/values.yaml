nameOverride: ''
fullnameOverride: ''

imagePullSecrets: []
nodeSelector: {}
tolerations: []
affinity: {}

api:
  replicas: 1
  image:
    repository: travel-agent-api
    tag: '' # defaults to the chart's appVersion
    pullPolicy: Always
  containerPort: 3000
  healthPath: /api/health
  service:
    port: 3000
  # Extra env vars. Web search settings (all optional):
  #   SEARCH_PROVIDER           tavily | off (default: tavily when TAVILY_API_KEY is set).
  #                             Kill switch: --set api.env.SEARCH_PROVIDER=off, or set it in
  #                             the homelab values and run `npm run deploy`.
  #   SEARCH_RATE_PER_MINUTE    default 30; SEARCH_DAILY_LIMIT default 500;
  #   SEARCH_CACHE_TTL_SECONDS  default 900. Limits are best-effort, per pod, and reset on
  #                             restart: the hard cost ceiling is the Tavily plan.
  env: {}
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000 # "node" in the official node image
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

web:
  replicas: 1
  image:
    repository: travel-agent-web
    tag: '' # defaults to the chart's appVersion
    pullPolicy: Always
  containerPort: 8080
  healthPath: /
  service:
    port: 80
  env: {}
  securityContext:
    runAsNonRoot: true
    runAsUser: 101 # "nginx" in nginx-unprivileged
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

# Which agent backend serves chat: inkeep (the Inkeep run API, below) or parlant
# (the in-chart Parlant service, below). Sets CHAT_BACKEND on the API; the web app
# reads it from /api/config and picks the matching chat engine.
chat:
  backend: inkeep

# The Inkeep agent service behind /api/chat. Chat returns 503 until apiUrl and
# existingSecret are both set.
inkeep:
  # Inkeep's agents API as seen from the API pod, e.g. http://inkeep-api.inkeep:3002
  apiUrl: ''
  tenantId: default
  projectId: travel-agent
  agentId: travel-agent
  # Secret (created outside the chart) whose keys are added to the API's env. It needs:
  #   INKEEP_AGENTS_RUN_API_BYPASS_SECRET  the Inkeep run API bypass secret
  #   INTAKE_API_TOKEN                     shared token Inkeep's context fetcher sends back
  #   TAVILY_API_KEY                       web search provider key (optional; search is off without it)
  #   SEARCH_API_TOKEN                     Bearer token the agents send to /api/search/web and /api/mcp;
  #                                        the same value as SEARCH_API_TOKEN in Inkeep's inkeep-secrets
  # kubectl -n travel-agent create secret generic travel-agent-inkeep \
  #   --from-literal=INKEEP_AGENTS_RUN_API_BYPASS_SECRET=... --from-literal=INTAKE_API_TOKEN=... \
  #   --from-literal=TAVILY_API_KEY=... --from-literal=SEARCH_API_TOKEN=...
  existingSecret: ''

ingress:
  enabled: true
  className: ''
  host: travel.example.com
  annotations: {}
  tls:
    enabled: false
    secretName: ''

# The Parlant agent service (apps/parlant), the alternative to Inkeep. The API
# proxies /api/parlant/* to it when chat.backend is parlant.
parlant:
  enabled: false
  replicas: 1
  image:
    repository: travel-agent-parlant
    tag: '' # defaults to the chart's appVersion
    pullPolicy: Always
  containerPort: 8800
  healthPath: /healthz
  service:
    port: 8800
  agentId: travel-agent
  # Parlant effort (min, low, medium, high, max) per phase. On Anthropic, replies
  # use Haiku 5.5 up to medium, Sonnet 5.5 at high and Opus 5.5 at max.
  effort:
    intake: high
    planning: high
  env: {}
  # Secret (created outside the chart) whose keys are added to Parlant's env. It needs:
  #   ANTHROPIC_API_KEY  Claude models
  #   VOYAGE_API_KEY     embeddings (Anthropic has no embedding API)
  #   INTAKE_API_TOKEN   the same token the API expects (see inkeep.existingSecret)
  #   SEARCH_API_TOKEN   the same search token the API expects (optional; the tool falls back without it)
  # kubectl -n travel-agent create secret generic travel-agent-parlant \
  #   --from-literal=ANTHROPIC_API_KEY=... --from-literal=VOYAGE_API_KEY=... \
  #   --from-literal=INTAKE_API_TOKEN=... --from-literal=SEARCH_API_TOKEN=...
  existingSecret: ''
  # Sessions and customers live in SQLite under PARLANT_HOME. Without a PVC they
  # reset whenever the pod restarts.
  persistence:
    enabled: false
    size: 1Gi
    storageClassName: ''
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
