nameOverride: ''
fullnameOverride: ''

imagePullSecrets: []
nodeSelector: {}
tolerations: []
affinity: {}

api:
  replicas: 1
  image:
    repository: travel-agent-api
    tag: latest
    pullPolicy: Always
  containerPort: 3000
  healthPath: /api/health
  service:
    port: 3000
  env: {}
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000 # "node" in the official node image
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

web:
  replicas: 1
  image:
    repository: travel-agent-web
    tag: latest
    pullPolicy: Always
  containerPort: 8080
  healthPath: /
  service:
    port: 80
  env: {}
  securityContext:
    runAsNonRoot: true
    runAsUser: 101 # "nginx" in nginx-unprivileged
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

# The Inkeep agent service behind /api/chat. Chat returns 503 until apiUrl and
# existingSecret are both set.
inkeep:
  # Inkeep's agents API as seen from the API pod, e.g. http://inkeep-agents-api.inkeep:3002
  apiUrl: ''
  tenantId: default
  projectId: travel-agent
  agentId: travel-agent
  # Secret (created outside the chart) whose keys are added to the API's env. It needs:
  #   INKEEP_AGENTS_RUN_API_BYPASS_SECRET  the Inkeep run API bypass secret
  #   INTAKE_API_TOKEN                     shared token Inkeep's context fetcher sends back
  # kubectl -n travel-agent create secret generic travel-agent-inkeep \
  #   --from-literal=INKEEP_AGENTS_RUN_API_BYPASS_SECRET=... --from-literal=INTAKE_API_TOKEN=...
  existingSecret: ''

ingress:
  enabled: true
  className: ''
  host: travel.example.com
  annotations: {}
  tls:
    enabled: false
    secretName: ''
