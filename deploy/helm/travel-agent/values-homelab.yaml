# Homelab cluster: helm upgrade --install travel-agent . -f values-homelab.yaml
api:
  image:
    repository: code.home.lab/admin/travel-agent-api

web:
  image:
    repository: code.home.lab/admin/travel-agent-web

# Images are built amd64-only; amalthea and adrastea are arm64.
nodeSelector:
  kubernetes.io/arch: amd64

ingress:
  className: cilium
  host: travel.home.lab
  annotations:
    cert-manager.io/cluster-issuer: homelab-ca
  tls:
    enabled: true
    secretName: travel-agent-tls
