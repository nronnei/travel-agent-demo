# Layered by the Tiltfile on top of the homelab repo's travel-agent values. The dev images run
# watchers as root against live-synced source, so production hardening is off.
api:
  securityContext: null
  env:
    # A lower best-effort cap for dev; the hard ceiling is the Tavily plan.
    SEARCH_DAILY_LIMIT: '100'
  resources:
    limits:
      memory: 1Gi

web:
  containerPort: 5173
  securityContext: null
  resources:
    requests:
      memory: 128Mi
    limits:
      # Vite's dependency optimizer spikes past 1Gi on startup alongside tsc --watch.
      memory: 2Gi

# Dev has its own Inkeep project, pointed at this namespace's API
# (scripts/push-agents.sh dev), so pushes for dev and prod don't collide.
inkeep:
  projectId: travel-agent-dev
  # Dev's own Inkeep (Tilt turns it on with --chat-backend=inkeep, the default); its
  # databases stay while another backend is selected.
  server:
    keepDatabases: true
    doltgres:
      storage:
        storageClassName: longhorn

# The dev namespace's own Postgres cluster (travel-agent-db). Longhorn like the
# other dev volumes; the homelab values pick longhorn-workers for prod.
postgres:
  enabled: true
  storageClass: longhorn

# Runs alongside Inkeep in dev; `tilt up -- --chat-backend=parlant` points the API at it.
parlant:
  enabled: true
  securityContext: null
  # Sessions and customers in the dev cluster's "parlant" database, so they
  # survive pod restarts; PARLANT_HOME (embedding cache, logs) is an emptyDir.
  postgres:
    enabled: true

# Runs alongside the others in dev; `tilt up -- --chat-backend=langgraph` points the API at it.
langgraph:
  enabled: true
  securityContext: null
  # Checkpoints in the dev cluster's "langgraph" database.
  postgres:
    enabled: true
