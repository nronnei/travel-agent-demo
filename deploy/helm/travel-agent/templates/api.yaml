{{- if and (eq .Values.chat.backend "langgraph") (not .Values.langgraph.enabled) -}}
{{- fail "chat.backend is langgraph, so set langgraph.enabled=true (the API has no LangGraph service to talk to)" -}}
{{- end -}}
{{- if and (eq .Values.chat.backend "parlant") (not .Values.parlant.enabled) -}}
{{- fail "chat.backend is parlant, so set parlant.enabled=true (the API has no Parlant service to talk to)" -}}
{{- end -}}
{{- $ctx := dict "root" . "component" "api" "values" .Values.api -}}
{{- $env := dict "PORT" .Values.api.containerPort -}}
{{- with .Values.inkeep -}}
{{- if .server.enabled -}}
{{- /* The in-chart Inkeep (templates/inkeep.yaml); apiUrl is ignored. */ -}}
{{- $_ := set $env "INKEEP_AGENTS_API_URL" (printf "http://%s:%v" (include "travel-agent.componentName" (dict "root" $ "component" "inkeep-api")) .server.api.service.port) -}}
{{- else if .apiUrl -}}
{{- $_ := set $env "INKEEP_AGENTS_API_URL" .apiUrl -}}
{{- end -}}
{{- $_ := set $env "INKEEP_TENANT_ID" .tenantId -}}
{{- $_ := set $env "INKEEP_PROJECT_ID" .projectId -}}
{{- $_ := set $env "INKEEP_AGENT_ID" .agentId -}}
{{- end -}}
{{- $_ := set $env "CHAT_BACKEND" .Values.chat.backend -}}
{{- if .Values.parlant.enabled -}}
{{- $_ := set $env "PARLANT_API_URL" (printf "http://%s:%v" (include "travel-agent.componentName" (dict "root" . "component" "parlant")) .Values.parlant.service.port) -}}
{{- $_ := set $env "PARLANT_AGENT_ID" .Values.parlant.agentId -}}
{{- end -}}
{{- if .Values.langgraph.enabled -}}
{{- $_ := set $env "LANGGRAPH_API_URL" (printf "http://%s:%v" (include "travel-agent.componentName" (dict "root" . "component" "langgraph")) .Values.langgraph.service.port) -}}
{{- end -}}
{{- $extra := dict -}}
{{- $secretEnv := list -}}
{{- if .Values.inkeep.server.enabled -}}
{{- /* The run API bypass secret comes from the Inkeep server's own Secret. */ -}}
{{- $secretEnv = append $secretEnv (dict "name" "INKEEP_AGENTS_RUN_API_BYPASS_SECRET" "secret" .Values.inkeep.server.secret "key" "INKEEP_AGENTS_RUN_API_BYPASS_SECRET") -}}
{{- end -}}
{{- if .Values.postgres.enabled -}}
{{- /* The API owns the cluster's bootstrap database; the operator writes its credentials. */ -}}
{{- $cluster := include "travel-agent.postgresClusterName" . -}}
{{- $ca := fromYaml (include "travel-agent.postgresCaMounts" .) -}}
{{- $_ := set $env "DATABASE_SSL_ROOT_CERT" "/etc/postgres-ca/ca.crt" -}}
{{- $secretEnv = append $secretEnv (dict "name" "DATABASE_URL" "secret" (printf "%s-app" $cluster) "key" "uri") -}}
{{- $_ := set $extra "volumes" (list $ca.volume) -}}
{{- $_ := set $extra "volumeMounts" (list $ca.mount) -}}
{{- end -}}
{{- if $secretEnv -}}
{{- $_ := set $extra "secretEnv" $secretEnv -}}
{{- end -}}
{{ include "travel-agent.deployment" (merge (dict "env" $env "envFromSecret" .Values.inkeep.existingSecret) $extra $ctx) }}
---
{{ include "travel-agent.service" $ctx }}
