{{- if .Values.ingress.enabled }}
{{- $api := include "travel-agent.componentName" (dict "root" . "component" "api") }}
{{- $web := include "travel-agent.componentName" (dict "root" . "component" "web") }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "travel-agent.fullname" . }}
  labels:
    {{- include "travel-agent.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName | default (printf "%s-tls" (include "travel-agent.fullname" .)) }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ $api }}
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $web }}
                port:
                  name: http
{{- end }}
