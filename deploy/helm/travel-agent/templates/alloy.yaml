{{- /*
This release's own collector (otel.enabled). Every service exports OTLP here; it stamps
each resource with the sender's k8s.pod.ip (k8sattributes passthrough: no Kubernetes
API access) and forwards to the central Alloy (otel.upstreamEndpoint), which does the
Kubernetes tagging by that IP and writes to Tempo/Prometheus/Loki. One path per signal.
*/ -}}
{{- $o := .Values.otel -}}
{{- if $o.enabled -}}
{{- $c := $o.collector -}}
{{- $name := include "travel-agent.componentName" (dict "root" . "component" "alloy") -}}
{{- $ctx := dict "root" . "component" "alloy" -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "travel-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: alloy
data:
  config.alloy: |
    logging {
      level  = "info"
      format = "logfmt"
    }

    otelcol.receiver.otlp "apps" {
      grpc {
        endpoint = "0.0.0.0:4317"
      }
      http {
        endpoint = "0.0.0.0:4318"
      }
      output {
        traces  = [otelcol.processor.k8sattributes.ip.input]
        metrics = [otelcol.processor.k8sattributes.ip.input]
      }
    }

    // Only adds k8s.pod.ip, from the app's own connection, so the central Alloy can
    // tag telemetry with the real pod rather than this collector's.
    otelcol.processor.k8sattributes "ip" {
      passthrough = true
      output {
        traces  = [otelcol.processor.batch.out.input]
        metrics = [otelcol.processor.batch.out.input]
      }
    }

    otelcol.processor.batch "out" {
      output {
        traces  = [otelcol.exporter.otlphttp.central.input]
        metrics = [otelcol.exporter.otlphttp.central.input]
      }
    }

    otelcol.exporter.otlphttp "central" {
      client {
        endpoint = {{ $o.upstreamEndpoint | quote }}
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "travel-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: alloy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "travel-agent.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "travel-agent.labels" . | nindent 8 }}
        app.kubernetes.io/component: alloy
      annotations:
        checksum/config: {{ printf "%s" $o | sha256sum }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 473 # "alloy" in the image
        runAsGroup: 473
        fsGroup: 473
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alloy
          image: "{{ $c.image.repository }}:{{ $c.image.tag }}"
          imagePullPolicy: {{ $c.image.pullPolicy }}
          args:
            - run
            - --storage.path=/var/lib/alloy
            - --server.http.listen-addr=0.0.0.0:12345
            - /etc/alloy/config.alloy
          ports:
            - name: otlp-http
              containerPort: 4318
            - name: otlp-grpc
              containerPort: 4317
            - name: http-metrics
              containerPort: 12345
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http-metrics
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/ready
              port: http-metrics
            periodSeconds: 20
          {{- with $c.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
              readOnly: true
            - name: storage
              mountPath: /var/lib/alloy
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ $name }}
        - name: storage
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "travel-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: alloy
spec:
  selector:
    {{- include "travel-agent.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: http-metrics
      port: 12345
      targetPort: http-metrics
{{- if $c.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $name }}
  labels:
    {{- include "travel-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: alloy
spec:
  selector:
    matchLabels:
      {{- include "travel-agent.selectorLabels" $ctx | nindent 6 }}
  endpoints:
    - port: http-metrics
{{- end }}
{{- end }}
