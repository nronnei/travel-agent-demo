[project]
name = "travel-agent-parlant"
version = "0.0.1"
description = "The travel agent built on Parlant, for comparison with the Inkeep agent"
requires-python = ">=3.12,<3.13"
dependencies = [
  "parlant[anthropic]==4.0.5",
  "httpx>=0.28",
  "pydantic>=2.10",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "respx>=0.22",
  "ruff>=0.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
